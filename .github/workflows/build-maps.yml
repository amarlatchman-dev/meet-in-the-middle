name: Build road maps

# Downloads OpenStreetMap data and builds the pre-loaded road files in data/.
# Runs on demand, monthly (to pick up road changes), and when the builder changes.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 3 * *"
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/build-maps.yml"

permissions:
  contents: write

concurrency:
  group: build-maps
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install osmium

      - name: Download road data
        run: |
          # Try the Ontario extract from Geofabrik, then the OpenStreetMap France mirror.
          ok=0
          for url in \
            https://download.geofabrik.de/north-america/canada/ontario-latest.osm.pbf \
            https://download.openstreetmap.fr/extracts/north-america/canada/ontario-latest.osm.pbf \
            https://download.openstreetmap.fr/extracts/north-america/canada/ontario.osm.pbf; do
            for i in 1 2 3; do
              echo "Trying $url (attempt $i)"
              if curl -fL --connect-timeout 30 --max-time 3600 -o ontario.osm.pbf "$url"; then ok=1; break 2; fi
              sleep $((i * 20))
            done
          done
          if [ "$ok" = 1 ]; then
            # bbox order for osmium is W,S,E,N
            osmium tags-filter ontario.osm.pbf w/highway -o roads-all.osm.pbf
            osmium extract -b -83.2,41.6,-74.3,45.7 roads-all.osm.pbf -o roads.osm.pbf
            osmium tags-filter ontario.osm.pbf \
              nwr/amenity=restaurant,fast_food,food_court,cafe,ice_cream,bar,pub,biergarten,cinema,theatre,arts_centre,library,marketplace,community_centre \
              nwr/shop=bakery,pastry,confectionery,chocolate,mall,department_store \
              nwr/leisure=park,garden,nature_reserve,dog_park,common,bowling_alley,escape_game,amusement_arcade,miniature_golf,trampoline_park,sports_centre,ice_rink,water_park,climbing \
              nwr/tourism=museum,gallery,zoo,aquarium,theme_park,attraction,viewpoint \
              -o pois-all.osm.pbf
            osmium extract -b -83.2,41.6,-74.3,45.7 pois-all.osm.pbf -o pois.osm.pbf
          else
            echo "No extract server reachable; falling back to Overpass tiles"
            python tools/fetch_overpass.py tiles --bbox 41.6,-83.2,45.7,-74.3 --step 0.25
            for f in tiles/*.osm; do osmium sort "$f" -o "${f%.osm}.pbf"; done
            osmium merge tiles/*.pbf -o roads.osm.pbf
          fi
          ls -la roads.osm.pbf

      - name: Build Southern Ontario road tiles
        run: |
          rm -rf data/tiles data/manifest.json
          python tools/build_region.py roads.osm.pbf data --bbox 41.6,-83.2,45.7,-74.3 --step 0.5 --name "Southern Ontario"
          if [ -f pois.osm.pbf ]; then
            rm -rf data/pois
            python tools/build_pois.py pois.osm.pbf data --bbox 41.6,-83.2,45.7,-74.3 --step 0.5
          fi
          du -sh data; ls data/tiles | wc -l

      - name: Commit the map file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update Southern Ontario roads and places from OpenStreetMap"
          git push
