name: Build road maps

# Builds road and "things to do" tiles for every region in tools/regions.json,
# in parallel, then uploads them to Cloudflare R2. Runs weekly so any region
# whose download failed (the mirrors are flaky) is filled in on a later run.
# R2 upload needs these repository secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY, R2_BUCKET. Without them the tiles are kept as a
# downloadable artifact on the run instead.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated region ids to build (blank = all)"
        required: false
        default: ""
  schedule:
    - cron: "17 6 * * 1"
  push:
    branches: [main]
    paths:  # only the map builders, so unrelated pushes (e.g. social posting) don't restart a build
      - "tools/build_region.py"
      - "tools/build_pois.py"
      - "tools/build_transit.py"
      - "tools/fetch_overpass.py"
      - "tools/make_index.py"
      - "tools/regions.json"
      - ".github/workflows/build-maps.yml"

permissions:
  contents: read

concurrency:
  group: build-maps
  cancel-in-progress: false  # queue new builds instead of cancelling a running one

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.m.outputs.regions }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          regions = json.load(open("tools/regions.json"))
          only = {x.strip() for x in os.environ.get("ONLY", "").split(",") if x.strip()}
          if only:
              regions = [r for r in regions if r["id"] in only]
          print("regions=" + json.dumps(regions))
          PY

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install osmium

      - name: Download ${{ matrix.region.name }}
        env:
          P: ${{ matrix.region.path }}
          BBBIKE: ${{ join(matrix.region.bbbike, ' ') }}
          OVERPASS_BBOX: ${{ matrix.region.overpass_bbox }}
        run: |
          # Geofabrik blocks GitHub's servers at times, so try the OpenStreetMap France mirror too.
          # Mirror folder names use underscores where Geofabrik uses hyphens.
          U="${P//-/_}"
          ok=0
          for url in \
            "https://download.openstreetmap.fr/extracts/$P-latest.osm.pbf" \
            "https://download.openstreetmap.fr/extracts/$U-latest.osm.pbf" \
            "https://download.openstreetmap.fr/extracts/$U.osm.pbf" \
            "https://download.geofabrik.de/$P-latest.osm.pbf"; do
            for i in 1 2; do
              echo "Trying $url (attempt $i)"
              if curl -fL --connect-timeout 30 --max-time 3600 -o region.osm.pbf "$url"; then ok=1; break 2; fi
              sleep 15
            done
          done
          # The mirror briefly removes files while refreshing them; wait and retry the main path
          for wait in 180 300; do
            [ "$ok" = 1 ] && break
            echo "Waiting ${wait}s for the mirror, then retrying"; sleep "$wait"
            curl -fL --connect-timeout 30 --max-time 3600 -o region.osm.pbf "https://download.openstreetmap.fr/extracts/$P-latest.osm.pbf" && ok=1
          done
          if [ "$ok" != 1 ]; then
            # Show what the mirror actually has, to help fix the path
            parent="$(dirname "$U")"
            echo "Mirror listing for $parent:"; curl -fsL "https://download.openstreetmap.fr/extracts/$parent/" | grep -o 'href="[^"]*"' | grep -i "$(basename "$U" | cut -c1-5)" | head -20 || true
          fi
          if [ "$ok" != 1 ] && [ -n "$BBBIKE" ]; then
            # Fall back to BBBike's metro-area extracts and merge them
            n=0
            for city in $BBBIKE; do
              echo "Trying BBBike $city"
              if curl -fL --connect-timeout 30 --max-time 1800 -o "bb-$city.osm.pbf" "https://download.bbbike.org/osm/bbbike/$city/$city.osm.pbf"; then n=$((n+1)); else rm -f "bb-$city.osm.pbf"; fi
            done
            if [ "$n" -gt 0 ]; then
              for f in bb-*.osm.pbf; do osmium sort "$f" -o "s-$f"; done
              osmium merge s-bb-*.osm.pbf -o region.osm.pbf && ok=1
              echo "::warning::Used BBBike metro extracts for $P ($n of them) instead of the full state"
            fi
          fi
          if [ "$ok" != 1 ] && [ -n "$OVERPASS_BBOX" ]; then
            # Small countries without their own extract: download everything straight from Overpass
            echo "Downloading $P from Overpass"
            python tools/fetch_overpass.py ov --bbox "$OVERPASS_BBOX" --step 2 --all
            for f in ov/*.osm; do osmium sort "$f" -o "${f%.osm}.pbf"; done
            osmium merge ov/*.pbf -o region.osm.pbf && ok=1
          fi
          [ "$ok" = 1 ] || { echo "::error::No download source worked for $P"; exit 1; }
          ls -la region.osm.pbf

      - name: Filter roads and places
        run: |
          osmium tags-filter region.osm.pbf w/highway -o roads.osm.pbf
          osmium tags-filter region.osm.pbf \
            nwr/amenity=restaurant,fast_food,food_court,cafe,ice_cream,bar,pub,biergarten,cinema,theatre,arts_centre,library,marketplace,community_centre,hookah_lounge,karaoke_box,nightclub,casino \
            nwr/shop=bakery,pastry,confectionery,chocolate,mall,department_store \
            nwr/leisure=park,garden,nature_reserve,dog_park,common,bowling_alley,escape_game,amusement_arcade,miniature_golf,trampoline_park,sports_centre,ice_rink,water_park,climbing,indoor_play \
            nwr/sport=billiards,snooker,laser_tag,paintball,karting,axe_throwing,10pin,bowling \
            nwr/tourism=museum,gallery,zoo,aquarium,theme_park,attraction,viewpoint \
            -o pois.osm.pbf
          osmium tags-filter region.osm.pbf \
            w/railway=subway,light_rail,tram,rail \
            n/railway=station,halt,tram_stop n/public_transport=station,stop_position \
            -o transit.osm.pbf
          rm region.osm.pbf

      - name: Build tiles
        env:
          ID: ${{ matrix.region.id }}
          NAME: ${{ matrix.region.name }}
        run: |
          python tools/build_region.py roads.osm.pbf "out/$ID" --step 0.5 --name "$NAME"
          python tools/build_pois.py pois.osm.pbf "out/$ID" --step 0.5
          python tools/build_transit.py transit.osm.pbf "out/$ID" --step 0.5
          du -sh "out/$ID"

      - uses: actions/upload-artifact@v4
        with:
          name: region-${{ matrix.region.id }}
          path: out/${{ matrix.region.id }}
          retention-days: 7

  publish:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: region-*
          path: artifacts

      - name: Get the current index from R2 (to keep regions that failed this run)
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          [ -n "$R2_ACCOUNT_ID" ] && [ -n "$AWS_ACCESS_KEY_ID" ] || exit 0
          aws s3 cp "s3://$R2_BUCKET/index.json" prev-index.json --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" || true

      - name: Make index.json
        run: python3 tools/make_index.py artifacts upload prev-index.json

      - name: Upload to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::notice::R2 secrets are not set yet, so tiles were not uploaded. They are attached to this run as the 'all-regions' artifact."
            echo "R2_READY=0" >> "$GITHUB_ENV"
            exit 0
          fi
          EP="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          # tiles first, index last, so the app never sees an index pointing at missing tiles
          aws s3 sync upload/ "s3://$R2_BUCKET/" --endpoint-url "$EP" --exclude index.json \
            --cache-control "public, max-age=86400" --only-show-errors
          aws s3 cp upload/index.json "s3://$R2_BUCKET/index.json" --endpoint-url "$EP" \
            --content-type application/json --cache-control "public, max-age=600"
          echo "R2_READY=1" >> "$GITHUB_ENV"

      - name: Keep tiles on the run (when R2 is not set up)
        if: env.R2_READY != '1'
        uses: actions/upload-artifact@v4
        with:
          name: all-regions
          path: upload
          retention-days: 14

      - name: Update the repo's copy of selected regions (only until R2 is set up)
        if: env.R2_READY != '1'
        env:
          REPO_REGIONS: "ontario antigua-and-barbuda"
        run: |
          mkdir -p sel
          for id in $REPO_REGIONS; do [ -f "artifacts/region-$id/manifest.json" ] && cp -r "artifacts/region-$id" sel/; done
          # keep a region from the previous repo copy if it failed this run
          for id in $REPO_REGIONS; do
            if [ ! -d "sel/region-$id" ] && [ -f "data/$id/manifest.json" ]; then cp -r "data/$id" "sel/region-$id"; fi
          done
          [ -n "$(ls sel)" ] || { echo "Nothing to copy"; exit 0; }
          rm -rf data && python3 tools/make_index.py sel data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update repo map copy ($REPO_REGIONS) from OpenStreetMap"
          git pull --rebase origin main
          git push
