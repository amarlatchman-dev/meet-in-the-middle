name: Build road maps

# Builds road and "things to do" tiles for every region in tools/regions.json,
# in parallel, then uploads them to Cloudflare R2.
# R2 upload needs these repository secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
# R2_SECRET_ACCESS_KEY, R2_BUCKET. Without them the tiles are kept as a
# downloadable artifact on the run instead.
on:
  workflow_dispatch:
    inputs:
      only:
        description: "Comma-separated region ids to build (blank = all)"
        required: false
        default: ""
  schedule:
    - cron: "17 6 3 * *"
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/build-maps.yml"

permissions:
  contents: read

concurrency:
  group: build-maps
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      regions: ${{ steps.m.outputs.regions }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        env:
          ONLY: ${{ github.event.inputs.only }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          regions = json.load(open("tools/regions.json"))
          only = {x.strip() for x in os.environ.get("ONLY", "").split(",") if x.strip()}
          if only:
              regions = [r for r in regions if r["id"] in only]
          print("regions=" + json.dumps(regions))
          PY

  build:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 15
      matrix:
        region: ${{ fromJSON(needs.plan.outputs.regions) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install osmium

      - name: Download ${{ matrix.region.name }}
        env:
          P: ${{ matrix.region.path }}
          BBBIKE: ${{ join(matrix.region.bbbike, ' ') }}
        run: |
          # Geofabrik blocks GitHub's servers at times, so try the OpenStreetMap France mirror too.
          # Mirror folder names use underscores where Geofabrik uses hyphens.
          U="${P//-/_}"
          ok=0
          for url in \
            "https://download.openstreetmap.fr/extracts/$P-latest.osm.pbf" \
            "https://download.openstreetmap.fr/extracts/$U-latest.osm.pbf" \
            "https://download.openstreetmap.fr/extracts/$U.osm.pbf" \
            "https://download.geofabrik.de/$P-latest.osm.pbf"; do
            for i in 1 2; do
              echo "Trying $url (attempt $i)"
              if curl -fL --connect-timeout 30 --max-time 3600 -o region.osm.pbf "$url"; then ok=1; break 2; fi
              sleep 15
            done
          done
          if [ "$ok" != 1 ]; then
            # Show what the mirror actually has, to help fix the path
            parent="$(dirname "$U")"
            echo "Mirror listing for $parent:"; curl -fsL "https://download.openstreetmap.fr/extracts/$parent/" | grep -o 'href="[^"]*"' | grep -i "$(basename "$U" | cut -c1-5)" | head -20 || true
          fi
          if [ "$ok" != 1 ] && [ -n "$BBBIKE" ]; then
            # Fall back to BBBike's metro-area extracts and merge them
            n=0
            for city in $BBBIKE; do
              echo "Trying BBBike $city"
              if curl -fL --connect-timeout 30 --max-time 1800 -o "bb-$city.osm.pbf" "https://download.bbbike.org/osm/bbbike/$city/$city.osm.pbf"; then n=$((n+1)); else rm -f "bb-$city.osm.pbf"; fi
            done
            if [ "$n" -gt 0 ]; then
              for f in bb-*.osm.pbf; do osmium sort "$f" -o "s-$f"; done
              osmium merge s-bb-*.osm.pbf -o region.osm.pbf && ok=1
              echo "::warning::Used BBBike metro extracts for $P ($n of them) instead of the full state"
            fi
          fi
          [ "$ok" = 1 ] || { echo "::error::No download source worked for $P"; exit 1; }
          ls -la region.osm.pbf

      - name: Filter roads and places
        run: |
          osmium tags-filter region.osm.pbf w/highway -o roads.osm.pbf
          osmium tags-filter region.osm.pbf \
            nwr/amenity=restaurant,fast_food,food_court,cafe,ice_cream,bar,pub,biergarten,cinema,theatre,arts_centre,library,marketplace,community_centre \
            nwr/shop=bakery,pastry,confectionery,chocolate,mall,department_store \
            nwr/leisure=park,garden,nature_reserve,dog_park,common,bowling_alley,escape_game,amusement_arcade,miniature_golf,trampoline_park,sports_centre,ice_rink,water_park,climbing \
            nwr/tourism=museum,gallery,zoo,aquarium,theme_park,attraction,viewpoint \
            -o pois.osm.pbf
          osmium tags-filter region.osm.pbf \
            w/railway=subway,light_rail,tram,rail \
            n/railway=station,halt,tram_stop n/public_transport=station,stop_position \
            -o transit.osm.pbf
          rm region.osm.pbf

      - name: Build tiles
        env:
          ID: ${{ matrix.region.id }}
          NAME: ${{ matrix.region.name }}
        run: |
          python tools/build_region.py roads.osm.pbf "out/$ID" --step 0.5 --name "$NAME"
          python tools/build_pois.py pois.osm.pbf "out/$ID" --step 0.5
          python tools/build_transit.py transit.osm.pbf "out/$ID" --step 0.5
          du -sh "out/$ID"

      - uses: actions/upload-artifact@v4
        with:
          name: region-${{ matrix.region.id }}
          path: out/${{ matrix.region.id }}
          retention-days: 7

  publish:
    needs: build
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: region-*
          path: artifacts

      - name: Make index.json
        run: python3 tools/make_index.py artifacts upload

      - name: Upload to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
        run: |
          if [ -z "$R2_ACCOUNT_ID" ] || [ -z "$R2_BUCKET" ] || [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::notice::R2 secrets are not set yet, so tiles were not uploaded. They are attached to this run as the 'all-regions' artifact."
            echo "R2_READY=0" >> "$GITHUB_ENV"
            exit 0
          fi
          EP="https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com"
          # tiles first, index last, so the app never sees an index pointing at missing tiles
          aws s3 sync upload/ "s3://$R2_BUCKET/" --endpoint-url "$EP" --exclude index.json \
            --cache-control "public, max-age=86400" --only-show-errors
          aws s3 cp upload/index.json "s3://$R2_BUCKET/index.json" --endpoint-url "$EP" \
            --content-type application/json --cache-control "public, max-age=600"
          echo "R2_READY=1" >> "$GITHUB_ENV"

      - name: Keep tiles on the run (when R2 is not set up)
        if: env.R2_READY != '1'
        uses: actions/upload-artifact@v4
        with:
          name: all-regions
          path: upload
          retention-days: 14
