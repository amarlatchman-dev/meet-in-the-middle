name: Build road maps

# Downloads OpenStreetMap data and builds the pre-loaded road files in data/.
# Runs on demand, monthly (to pick up road changes), and when the builder changes.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 3 * *"
  push:
    branches: [main]
    paths:
      - "tools/build_region.py"
      - ".github/workflows/build-maps.yml"

permissions:
  contents: write

concurrency:
  group: build-maps
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install osmium

      - name: Download Ontario from Geofabrik
        run: curl -fL --retry 3 -o ontario.osm.pbf https://download.geofabrik.de/north-america/canada/ontario-latest.osm.pbf

      - name: Cut out the Greater Toronto Area (Niagara to Oshawa)
        run: |
          # bbox order for osmium is W,S,E,N
          osmium extract -b -80.25,42.85,-78.65,44.15 ontario.osm.pbf -o gta.osm.pbf
          osmium tags-filter gta.osm.pbf w/highway -o gta-roads.osm.pbf

      - name: Build data/gta.bin
        run: |
          mkdir -p data
          python tools/build_region.py gta-roads.osm.pbf data/gta.bin --bbox 42.85,-80.25,44.15,-78.65
          ls -la data

      - name: Commit the map file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gta.bin
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update GTA road map from OpenStreetMap"
          git push
