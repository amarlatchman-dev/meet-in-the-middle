name: Build road maps

# Downloads OpenStreetMap data and builds the pre-loaded road files in data/.
# Runs on demand, monthly (to pick up road changes), and when the builder changes.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 3 * *"
  push:
    branches: [main]
    paths:
      - "tools/**"
      - ".github/workflows/build-maps.yml"

permissions:
  contents: write

concurrency:
  group: build-maps
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q osmium-tool
          pip install osmium

      - name: Download road data
        run: |
          # Primary: Geofabrik's Ontario extract. Retry, since it can be briefly unreachable.
          ok=0
          for i in 1 2 3 4 5; do
            if curl -fL --connect-timeout 30 -o ontario.osm.pbf https://download.geofabrik.de/north-america/canada/ontario-latest.osm.pbf; then ok=1; break; fi
            echo "Geofabrik attempt $i failed; waiting"; sleep $((i * 30))
          done
          if [ "$ok" = 1 ]; then
            # bbox order for osmium is W,S,E,N
            osmium extract -b -80.25,42.85,-78.65,44.15 ontario.osm.pbf -o gta.osm.pbf
            osmium tags-filter gta.osm.pbf w/highway -o gta-roads.osm.pbf
          else
            echo "Geofabrik unreachable; falling back to Overpass tiles"
            python tools/fetch_overpass.py tiles --bbox 42.85,-80.25,44.15,-78.65
            for f in tiles/*.osm; do osmium sort "$f" -o "${f%.osm}.pbf"; done
            osmium merge tiles/*.pbf -o gta-roads.osm.pbf
          fi
          ls -la gta-roads.osm.pbf

      - name: Build data/gta.bin
        run: |
          mkdir -p data
          python tools/build_region.py gta-roads.osm.pbf data/gta.bin --bbox 42.85,-80.25,44.15,-78.65
          ls -la data

      - name: Commit the map file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/gta.bin
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "Update GTA road map from OpenStreetMap"
          git push
