<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Meet in the Middle</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: full-height split. Control panel on the left, glowing road map on the right; stacks map-over-panel on phones. */
:root {
  --ink: #05080b;        /* map + page ground */
  --panel: #0c1217;      /* control panel */
  --raise: #151e25;      /* inputs, rows */
  --line: #22303a;       /* hairlines */
  --text: #e6eef2;
  --muted: #8a9ba6;
  --accent: #ffd34d;     /* primary action: lamplight gold */
  --danger: #ff6b7d;
  --road: #1d3b2f;       /* unexplored road glow */
  --f-display: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
  --f-body: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body { background: var(--ink); color: var(--text); font: 14px/1.45 var(--f-body); }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

#app { display: grid; grid-template-columns: 360px 1fr; height: 100%; }
#panel {
  background: var(--panel); border-right: 1px solid var(--line);
  overflow-y: auto; display: flex; flex-direction: column; gap: 18px;
  padding: 20px 18px 28px;
}
#mapwrap { position: relative; min-width: 0; }
#map { position: absolute; inset: 0; background: var(--ink); }

h1 { font: 700 26px/1.05 var(--f-display); margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
h1 span { color: var(--accent); }
.lede { margin: 6px 0 0; color: var(--muted); font-size: 13px; }
.label { font: 600 11px/1 var(--f-body); letter-spacing: 0.09em; text-transform: uppercase; color: var(--muted); }
.row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }

/* Search */
.search { position: relative; }
.search input {
  width: 100%; background: var(--raise); border: 1px solid var(--line); border-radius: 10px;
  padding: 11px 12px 11px 36px; outline: none;
}
.search input:focus { border-color: #3b4f5c; }
.search svg { position: absolute; left: 12px; top: 13px; width: 15px; height: 15px; stroke: var(--muted); fill: none; stroke-width: 2; }
#suggest {
  position: absolute; z-index: 1000; top: calc(100% + 4px); left: 0; right: 0; margin: 0; padding: 4px;
  list-style: none; background: var(--raise); border: 1px solid var(--line); border-radius: 10px;
  box-shadow: 0 12px 30px rgba(0,0,0,.5); max-height: 280px; overflow-y: auto;
}
#suggest button { display: block; width: 100%; text-align: left; background: none; border: 0; border-radius: 7px; padding: 8px 10px; }
#suggest button:hover, #suggest button.active { background: #1e2a33; }
#suggest b { display: block; font-weight: 600; }
#suggest small { color: var(--muted); }
#suggest .msg { padding: 8px 10px; color: var(--muted); }
.add-tools { display: flex; gap: 8px; margin-top: 8px; }
.ghost {
  background: none; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  color: var(--muted); font-size: 12.5px;
}
.ghost:hover { color: var(--text); border-color: #3b4f5c; }
.ghost[aria-pressed="true"] { color: var(--ink); background: var(--accent); border-color: var(--accent); }

/* People */
#people { list-style: none; margin: 8px 0 0; padding: 0; display: flex; flex-direction: column; gap: 6px; }
.person {
  display: grid; grid-template-columns: 28px 1fr auto; align-items: center; gap: 10px;
  background: var(--raise); border-radius: 10px; padding: 8px 8px 8px 10px;
}
.avatar {
  width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center;
  font: 700 12px var(--f-display); color: var(--ink); background: var(--c);
  box-shadow: 0 0 10px var(--c);
}
.person .who { min-width: 0; }
.person input {
  width: 100%; background: none; border: 0; padding: 0; font-weight: 600; outline: none;
  border-bottom: 1px dashed transparent;
}
.person input:focus { border-bottom-color: var(--muted); }
.person .where { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.person .x { background: none; border: 0; color: var(--muted); width: 28px; height: 28px; border-radius: 6px; font-size: 18px; line-height: 1; }
.person .x:hover { color: var(--danger); background: #1e2a33; }
.empty { color: var(--muted); font-size: 13px; padding: 10px; border: 1px dashed var(--line); border-radius: 10px; }
.example-chip { font-size: 12px; color: var(--muted); }
.example-chip button { background: none; border: 0; padding: 0; color: var(--accent); text-decoration: underline; font-size: 12px; }

/* Options */
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--raise); border-radius: 10px; padding: 3px; margin-top: 8px; }
.seg button { background: none; border: 0; border-radius: 8px; padding: 7px 6px; color: var(--muted); font-size: 13px; }
.seg button[aria-pressed="true"] { background: #24323c; color: var(--text); font-weight: 600; }
.hint { color: var(--muted); font-size: 12px; margin: 6px 0 0; }
.seg.four { grid-template-columns: repeat(4, 1fr); }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.compare td { padding: 6px 4px; }
.compare th { font: 600 10.5px var(--f-body); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); text-align: right; padding: 0 4px 4px; }
.compare th:first-child { text-align: left; }
.compare tr.sel td { color: var(--text); }
.compare tr.sel td:first-child { font-weight: 700; }
.compare button { background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 11.5px; color: var(--text); }
.compare button:hover { border-color: var(--accent); }
.compare .k { display: inline-grid; place-items: center; width: 18px; height: 18px; border-radius: 50%; font: 700 10px var(--f-display); margin-right: 6px; background: #fff; color: var(--ink); }
.alt-pin { width: 24px; height: 24px; border-radius: 50%; background: rgba(5,8,11,.9); border: 2px solid #fff; color: #fff; display: grid; place-items: center; font: 700 11px var(--f-display); box-shadow: 0 0 10px rgba(255,255,255,.5); cursor: pointer; }
.when-row { display: flex; gap: 8px; margin-top: 8px; }
.when-row input { flex: 1; min-width: 0; background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 8px 10px; }
.invite-row { margin-top: 8px; }
.invite-row .ghost { width: 100%; }
.join-banner { margin-top: 8px; font-size: 12.5px; line-height: 1.45; padding: 10px 12px; border-radius: 10px; background: #1b2a1f; border: 1px solid #2f5a3b; color: var(--text); }
.toast { position: fixed; z-index: 2000; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--text); color: var(--ink); padding: 8px 14px; border-radius: 999px; font-weight: 600; font-size: 13px; box-shadow: 0 6px 20px rgba(0,0,0,.5); }
.leave { color: var(--accent); }
td small { display: block; color: var(--muted); font-size: 11px; }
.open-toggle { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: var(--text); cursor: pointer; }
.open-toggle input { accent-color: #4fe3a8; width: 16px; height: 16px; }
.st-open { color: #4fe3a8; font-weight: 600; }
.st-closed { color: var(--danger); font-weight: 600; }

#go {
  width: 100%; border: 0; border-radius: 12px; padding: 13px; background: var(--accent); color: #1a1400;
  font: 700 15px var(--f-display); letter-spacing: 0.01em;
}
#go:disabled { opacity: .4; cursor: not-allowed; }
#status { font-size: 13px; color: var(--muted); display: flex; gap: 10px; align-items: center; }
#status.err { color: var(--danger); }
.spin { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--accent); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }

/* Results */
#nearby { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 10px; }
#nearby .note { margin: 0; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { background: var(--raise); border: 1px solid var(--line); border-radius: 999px; padding: 5px 11px; font-size: 12.5px; color: var(--text); }
.chip:hover { border-color: var(--k); }
.chip[aria-pressed="true"] { color: var(--ink); background: var(--k); border-color: var(--k); font-weight: 600; }
.chip.sub { font-size: 11.5px; padding: 3px 9px; }
#nb-sub { padding-left: 10px; border-left: 2px solid var(--line); }
.chip .ct { opacity: .7; margin-left: 5px; font-family: var(--f-mono); font-size: 11px; }
#nb-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.poi { display: grid; grid-template-columns: 10px 1fr auto; gap: 10px; align-items: start; padding: 9px 4px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 6px; }
.poi:hover, .poi:focus-visible { background: #111a20; }
.poi .k { width: 10px; height: 10px; border-radius: 50%; background: var(--k); box-shadow: 0 0 6px var(--k); margin-top: 5px; }
.poi .nm { min-width: 0; }
.poi b { font-weight: 600; display: block; }
.poi small { color: var(--muted); font-size: 12px; display: block; }
.poi .d { font-family: var(--f-mono); font-size: 12px; color: var(--muted); text-align: right; white-space: nowrap; display: flex; flex-direction: column; gap: 2px; }
.poi a { color: var(--muted); font-size: 12px; font-family: var(--f-body); }
.free-tag { color: #4fe3a8; font-weight: 600; }
.add-tools { flex-wrap: wrap; }
#results { border-top: 1px solid var(--line); padding-top: 16px; display: flex; flex-direction: column; gap: 12px; }
.meet-name { font: 700 22px/1.1 var(--f-display); margin: 4px 0 2px; text-wrap: balance; }
.meet-sub { color: var(--muted); font-size: 12.5px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.actions a, .actions button {
  font-size: 12.5px; text-decoration: none; color: var(--text); background: var(--raise);
  border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
}
.actions a:hover, .actions button:hover { border-color: #3b4f5c; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
td { padding: 7px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.num { text-align: right; font-family: var(--f-mono); font-size: 12.5px; white-space: nowrap; }
td .dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 6px var(--c); margin-right: 8px; }
td a { color: var(--muted); font-size: 12px; }
tr.longest td.num:first-of-type { color: var(--accent); }
.note { font-size: 12px; color: var(--muted); }

/* Map HUD */
#hud {
  position: absolute; z-index: 500; top: 14px; left: 0; right: 0; text-align: center; pointer-events: none;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
}
#hud .h { font: 700 clamp(20px, 3.2vw, 34px)/1.1 var(--f-display); color: var(--hc, var(--accent)); text-shadow: 0 2px 14px rgba(0,0,0,.9); }
#hud .h .n { font-family: var(--f-mono); color: var(--text); font-size: .62em; font-weight: 700; margin-left: .35em; }
#hud .h .n small { color: var(--muted); font-size: .8em; font-weight: 500; }
#hud .s { margin-top: 4px; font: 600 14px var(--f-body); color: var(--text); text-shadow: 0 1px 8px #000; }
#replay {
  position: absolute; z-index: 500; right: max(14px, env(safe-area-inset-right, 0px)); bottom: 28px;
  background: rgba(12,18,23,.88); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-size: 13px;
}
#replay:hover { border-color: var(--accent); }

/* Leaflet theming */
.leaflet-container { background: var(--ink); font-family: var(--f-body); }
.leaflet-control-attribution { background: rgba(5,8,11,.75) !important; color: var(--muted) !important; }
.leaflet-control-attribution a { color: #a9bac4 !important; }
.leaflet-bar a { background: var(--panel) !important; color: var(--text) !important; border-color: var(--line) !important; }
.leaflet-tooltip.tag {
  background: rgba(5,8,11,.85); color: var(--c); border: 1px solid var(--c); border-radius: 4px;
  font: 700 11px var(--f-body); padding: 2px 6px; box-shadow: 0 0 8px rgba(0,0,0,.6);
}
.leaflet-tooltip.tag::before { display: none; }
.pin-avatar {
  width: 30px; height: 30px; border-radius: 50%; background: rgba(5,8,11,.9); border: 2.5px solid var(--c);
  display: grid; place-items: center; font: 700 12px var(--f-display); color: var(--c);
  box-shadow: 0 0 12px var(--c), inset 0 0 8px var(--c);
}
.meet-pin { width: 38px; height: 38px; border-radius: 50% 50% 50% 0; transform: rotate(-45deg); background: #fff; display: grid; place-items: center; box-shadow: 0 0 22px rgba(255,255,255,.8); }
.meet-pin span { transform: rotate(45deg); font-size: 16px; color: var(--ink); font-weight: 700; }
.leaflet-tooltip.meet-tag { background: #fff; color: var(--ink); border: 0; font: 700 12px var(--f-body); padding: 3px 8px; border-radius: 4px; }
.leaflet-tooltip.meet-tag::before { display: none; }
.route-glow { filter: blur(3px); }
.flood-canvas { pointer-events: none; }
.picking #map, .picking .leaflet-container { cursor: crosshair !important; }

@media (max-width: 760px) {
  #app { grid-template-columns: 1fr; grid-template-rows: 58vh auto; height: auto; min-height: 100%; }
  #mapwrap { order: -1; height: 58vh; }
  #panel {
    border-right: 0; border-top: 1px solid var(--line); overflow: visible;
    padding-block: 18px 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  #hud .s { font-size: 12.5px; }
}
@media (prefers-reduced-motion: reduce) { .spin { animation-duration: 2.5s; } }
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <header>
      <h1>Meet in the <span>Middle</span></h1>
      <p class="lede">Add up to 10 starting points. Each one floods outward along the real streets, and the meeting spot is where the floods meet.</p>
    </header>

    <section>
      <div class="search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search an address or place" autocomplete="off" aria-label="Search an address or place">
        <ul id="suggest" hidden></ul>
      </div>
      <div class="add-tools">
        <button class="ghost" id="locate">Use my location</button>
        <button class="ghost" id="pick" aria-pressed="false">Drop a pin on the map</button>
      </div>
    </section>

    <section>
      <div class="row">
        <span class="label">People</span>
        <span class="label" id="count">0 / 10</span>
      </div>
      <ul id="people"></ul>
      <div class="invite-row">
        <button class="ghost" id="invite">Invite friends to add their location</button>
      </div>
      <div class="join-banner" id="join" hidden></div>
      <div class="example-chip" id="example" hidden>Example group in Toronto. Adding someone replaces it, or <button id="clear">clear it now</button>.</div>
    </section>

    <section>
      <span class="label">Travel by</span>
      <div class="seg four" id="mode">
        <button data-v="drive" aria-pressed="true">Car</button>
        <button data-v="transit" aria-pressed="false">Transit</button>
        <button data-v="bike" aria-pressed="false">Bike</button>
        <button data-v="walk" aria-pressed="false">Walk</button>
      </div>
      <p class="hint" id="mode-hint" hidden></p>
      <div style="height:12px"></div>
      <label class="label" for="when">When are you meeting?</label>
      <div class="when-row">
        <input type="datetime-local" id="when" step="300">
        <button class="ghost" id="when-now">Now</button>
      </div>
      <div style="height:12px"></div>
      <span class="label">Pick the spot that</span>
      <div class="seg three" id="goal">
        <button data-v="fair" aria-pressed="true">Fairest</button>
        <button data-v="balanced" aria-pressed="false">Balanced</button>
        <button data-v="total" aria-pressed="false">Least total</button>
      </div>
      <p class="hint" id="goal-hint"></p>
    </section>

    <button id="go">Find the meeting spot</button>
    <div id="status" hidden></div>
    <section id="results" hidden></section>
    <section id="nearby" hidden>
      <div class="row"><span class="label">Things to do nearby</span><span class="label" id="nb-radius"></span></div>
      <div class="chips" id="nb-filters" role="group" aria-label="Filter places"></div>
      <div class="chips" id="nb-sub" role="group" aria-label="Cuisine and diet" hidden></div>
      <label class="open-toggle"><input type="checkbox" id="nb-open"> <span id="nb-open-label">Open at meeting time</span></label>
      <p class="note" id="nb-hint"></p>
      <div id="nb-status" class="note"></div>
      <ul id="nb-list"></ul>
    </section>
  </aside>

  <main id="mapwrap">
    <div id="map"></div>
    <div id="hud"><div class="h" id="hud-h"></div><div class="s" id="hud-s"></div></div>
    <button id="replay" hidden>Replay</button>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
"use strict";
/* ---------------- constants ---------------- */
const MAX_PEOPLE = 10;
const COLORS = ["#ffcf3f", "#9a86ff", "#ff5c84", "#55b8ff", "#4fe3a8", "#ff8c3a", "#d06bff", "#39e1e1", "#ff6fd2", "#b8f24a"];
const OVERPASS = [
  "https://overpass-api.de/api/interpreter",
  "https://overpass.private.coffee/api/interpreter",
  "https://maps.mail.ru/osm/tools/overpass/api/interpreter",
];
const WALK_MS = 4.8 / 3.6;
const BIKE_MS = 16 / 3.6;
const MODE_INFO = {
  drive: { label: "driving", gmaps: "driving" },
  transit: { label: "transit", gmaps: "transit" },
  bike: { label: "cycling", gmaps: "bicycling" },
  walk: { label: "walking", gmaps: "walking" },
};
const EXAMPLE = [
  { name: "Priya", label: "York University", lat: 43.7735, lon: -79.5019 },
  { name: "Noah", label: "Don Mills", lat: 43.7347, lon: -79.3443 },
  { name: "Ava", label: "Rosedale", lat: 43.6790, lon: -79.3800 },
  { name: "Ryan", label: "High Park", lat: 43.6465, lon: -79.4637 },
];

/* ---------------- state ---------------- */
let people = [];
let settings = { mode: "drive", goal: "fair", when: "" };
let isExample = false;
let uid = 1;
let G = null;          // road graph
let result = null;     // computed analysis
let busy = false;
const anim = { running: false, phase: "idle", person: 0, drawn: 0, raf: 0 };
const $ = (id) => document.getElementById(id);

function save() {
  try { localStorage.setItem("mitm.v1", JSON.stringify({ people, settings, isExample })); } catch (e) {}
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem("mitm.v1"));
    if (d && Array.isArray(d.people)) {
      people = d.people.slice(0, MAX_PEOPLE).map((p) => ({ ...p, id: uid++ }));
      settings = { ...settings, ...(d.settings || {}) };
      isExample = !!d.isExample;
      return true;
    }
  } catch (e) {}
  return false;
}
function freeColor() {
  const used = new Set(people.map((p) => p.color));
  return COLORS.find((c) => !used.has(c)) || COLORS[people.length % COLORS.length];
}
function initial(name) { return (name.trim()[0] || "?").toUpperCase(); }

/* ---------------- map ---------------- */
const map = L.map("map", { zoomControl: true, preferCanvas: false, worldCopyJump: true }).setView([43.71, -79.42], 11);
L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/Canvas/World_Dark_Gray_Base/MapServer/tile/{z}/{y}/{x}", {
  maxZoom: 19, maxNativeZoom: 16, opacity: 0.8,
  attribution: 'Basemap &copy; Esri | Roads &copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',
}).addTo(map);
map.createPane("flood").style.zIndex = 380;
map.createPane("routes").style.zIndex = 420;
const routeRenderer = L.svg({ pane: "routes", padding: 0.5 });

const markers = new Map();
function personIcon(p) {
  return L.divIcon({
    className: "", iconSize: [30, 30], iconAnchor: [15, 15],
    html: `<div class="pin-avatar" style="--c:${p.color}">${escapeHtml(initial(p.name))}</div>`,
  });
}
function syncMarkers() {
  const ids = new Set(people.map((p) => p.id));
  for (const [id, m] of markers) if (!ids.has(id)) { map.removeLayer(m); markers.delete(id); }
  for (const p of people) {
    let m = markers.get(p.id);
    if (!m) {
      m = L.marker([p.lat, p.lon], { icon: personIcon(p), draggable: true, zIndexOffset: 500 }).addTo(map);
      m.on("dragend", async () => {
        const ll = m.getLatLng();
        p.lat = ll.lat; p.lon = ll.lng; p.label = "Dropped pin";
        isExample = false; invalidate(); renderList(); save();
        const lbl = await reverseLabel(p.lat, p.lon);
        if (lbl) { p.label = lbl; renderList(); save(); }
      });
      markers.set(p.id, m);
    }
    m.setLatLng([p.lat, p.lon]);

function hav(a1, o1, a2, o2) {
  const R = 6371008, r = Math.PI / 180;
  const dA = (a2 - a1) * r, dO = (o2 - o1) * r;

    for (let attempt = 0; attempt < 2; attempt++) {

async function analyze() {

async function analyzeGrid() {

  const mode = settings.mode;

  for (const p of people) { s = Math.min(s, p.lat); n = Math.max(n, p.lat); w = Math.min(w, p.lon); e = Math.max(e, p.lon); }
  const spanKm = hav(s, w, n, e) / 1000;
  if (mode === "bike" && spanKm > 120) return setStatus(`These locations are about ${Math.round(spanKm)} km apart, which is a long ride. Switch to Car for groups this spread out.`, "err");
  if (mode === "walk" && spanKm > 40) return setStatus(`These locations are about ${Math.round(spanKm)} km apart, which is a long walk. Switch to Car for groups this spread out.`, "err");
  if (spanKm > 800) return setStatus(`These locations are about ${Math.round(spanKm)} km apart. Try a group within a few hundred kilometres of each other.`, "err");

// pick the best grid cell, refine around it, then fetch real routes

  const routes = await Promise.all(people.map((p) =>
    osrm(R.mode, "route", [[p.lat, p.lon], cand.loc], "overview=full&geometries=geojson").then((j) => j.routes[0]).catch(() => null)));

    const off = hav(p.lat, p.lon, R.paths[i][0][0], R.paths[i][0][1]);

}

    if (c.id !== "all" && c.id !== "free" && !n) continue;
    const b = document.createElement("button");
    b.className = "chip"; b.style.setProperty("--k", c.color);
    b.setAttribute("aria-pressed", c.id === nbFilter);
    b.innerHTML = `${escapeHtml(c.label)}<span class="ct">${n}</span>`;
    b.addEventListener("click", () => { nbFilter = c.id; nbSub = ""; renderNearby(); });
    box.appendChild(b);
  }
  // second row: cuisine and diet filters for food categories
  const sub = $("nb-sub"); sub.textContent = "";
  const cat = CATS.find((c) => c.id === nbFilter);
  const base = nbFilter === "all" ? list : list.filter((p) => p.cats.includes(nbFilter));
  if (cat && cat.food) {
    const counts = new Map();
    base.forEach((p) => cuisines(p.tags).forEach((c) => counts.set(c, (counts.get(c) || 0) + 1)));
    const opts = [{ id: "", label: "Any", n: base.length }]
      .concat(DIETS.map((d) => ({ id: d.id, label: d.label, n: base.filter((p) => d.test(p.tags)).length })).filter((o) => o.n))
      .concat([...counts].sort((a, b) => b[1] - a[1]).slice(0, 14).map(([c, n]) => ({ id: c, label: pretty(c), n })));
    if (opts.length > 1) {
      for (const o of opts) {
        const b = document.createElement("button");
        b.className = "chip sub"; b.style.setProperty("--k", cat.color);
        b.setAttribute("aria-pressed", o.id === nbSub);
        b.innerHTML = `${escapeHtml(o.label)}<span class="ct">${o.n}</span>`;
        b.addEventListener("click", () => { nbSub = o.id; renderNearby(); });
        sub.appendChild(b);
      }
    }
  }
  sub.hidden = !sub.childElementCount;
  $("nb-hint").textContent = nbFilter === "free" ? FREE_HINT : "";
  const at = meetDate(), onlyOpen = $("nb-open").checked;
  const matched = base.filter((p) => subMatch(p, nbSub));
  const shown = (onlyOpen ? matched.filter((p) => openAt(p.tags.opening_hours, at) === true) : matched).slice(0, 40);
  const unknown = matched.filter((p) => openAt(p.tags.opening_hours, at) === null).length;
  $("nb-status").textContent = shown.length
    ? (onlyOpen && unknown ? `${unknown} place${unknown > 1 ? "s" : ""} without listed hours ${unknown > 1 ? "are" : "is"} hidden.` : "")
    : onlyOpen ? `Nothing here is listed as open at ${fmtClock(at)}.${unknown ? ` ${unknown} place${unknown > 1 ? "s have" : " has"} no listed hours.` : ""}`
    : (nbFilter === "free" ? "No free public spaces found close by. Try a different filter." : "Nothing found close to the meeting spot.");
  const ul = $("nb-list"); ul.textContent = "";
  poiLayer.clearLayers();
  for (const p of shown) {
    const m = L.circleMarker([p.lat, p.lon], { radius: 6, color: p.color, weight: 2, fillColor: p.color, fillOpacity: 0.55, pane: "markerPane" })
      .bindTooltip(escapeHtml(p.name), { direction: "top", offset: [0, -6] }).addTo(poiLayer);
    const li = document.createElement("li");
    li.className = "poi"; li.tabIndex = 0; li.style.setProperty("--k", p.color);
    const st = openAt(p.tags.opening_hours, at);
    const stTxt = st === true ? `<span class="st-open">Open at ${fmtClock(at)}</span>` : st === false ? `<span class="st-closed">Closed at ${fmtClock(at)}</span>` : "";
    const hours = p.tags.opening_hours ? `<small>${stTxt}${stTxt ? " · " : ""}${escapeHtml(p.tags.opening_hours.slice(0, 60))}</small>` : "";
    const gq = encodeURIComponent(`${p.name} ${p.lat.toFixed(5)},${p.lon.toFixed(5)}`);
    li.innerHTML = `<span class="k"></span>
      <div class="nm"><b>${escapeHtml(p.name)}</b><small>${escapeHtml(poiKind(p.tags))}${p.free ? ' · <span class="free-tag">Free</span>' : ""}</small>${hours}</div>
      <div class="d"><span>${fmtKm(p.d)}</span><a href="https://www.google.com/maps/search/?api=1&query=${gq}" target="_blank" rel="noopener">Map</a></div>`;
    const focus = () => { map.flyTo([p.lat, p.lon], Math.max(map.getZoom(), 16), { duration: 0.8 }); m.openTooltip(); };
    li.addEventListener("click", (e) => { if (!e.target.closest("a")) focus(); });
    li.addEventListener("keydown", (e) => { if (e.key === "Enter") focus(); });
    ul.appendChild(li);
  }
}

$("replay").addEventListener("click", () => { if (result) play(false); });
$("go").addEventListener("click", analyze);

function escapeHtml(s) { return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }

/* ---------------- meeting time ---------------- */
function pad2(n) { return String(n).padStart(2, "0"); }
function toLocalInput(d) { return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}T${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function nextHalfHour() { const d = new Date(Date.now() + 15 * 60000); d.setSeconds(0, 0); d.setMinutes(d.getMinutes() < 30 ? 30 : 60); return d; }
function meetDate() {
  const d = settings.when ? new Date(settings.when) : null;
  return d && !isNaN(d) ? d : nextHalfHour();
}
function fmtClock(d, ref) {
  const t = d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
  const base = ref || new Date();
  if (d.toDateString() === base.toDateString()) return t;
  return d.toLocaleDateString([], { weekday: "short" }) + " " + t;
}
function syncWhen() {
  $("when").value = toLocalInput(meetDate());
  $("nb-open-label").textContent = `Open at ${fmtClock(meetDate())}`;
}
$("when").addEventListener("change", () => {
  settings.when = $("when").value; save(); syncWhen();
  if (result && result.dist) renderResults();
  renderNearby();
});
$("when-now").addEventListener("click", () => { settings.when = toLocalInput(new Date()); save(); syncWhen(); if (result && result.dist) renderResults(); renderNearby(); });

/* ---------------- opening hours ---------------- */
// Understands the common OpenStreetMap formats ("Mo-Fr 08:00-17:00; Sa 10:00-14:00", "24/7",
// overnight ranges, "off"). Returns true/false, or null when the hours are missing or too unusual.
const OH_DAYS = ["Mo", "Tu", "We", "Th", "Fr", "Sa", "Su"];
function ohDays(spec) {
  const out = new Set();
  for (const part of spec.split(",")) {
    const p = part.trim();
    if (!p || p === "PH" || p === "SH") continue;
    const m = p.match(/^(Mo|Tu|We|Th|Fr|Sa|Su)(?:\[[^\]]*\])?(?:-(Mo|Tu|We|Th|Fr|Sa|Su))?$/);
    if (!m) return null;
    const a = OH_DAYS.indexOf(m[1]), b = m[2] ? OH_DAYS.indexOf(m[2]) : a;
    for (let i = a; ; i = (i + 1) % 7) { out.add(i); if (i === b) break; }
  }
  return out;
}
function ohTimes(spec) {
  const out = [];
  for (const part of spec.split(",")) {
    const m = part.trim().match(/^(\d{1,2}):(\d{2})\s*-\s*(\d{1,2}):(\d{2})\+?$/) || part.trim().match(/^(\d{1,2}):(\d{2})\+$/);
    if (!m) return null;
    const a = +m[1] * 60 + +m[2];
    let b = m[3] != null ? +m[3] * 60 + +m[4] : 24 * 60;
    if (b <= a) b += 24 * 60; // runs past midnight
    out.push([a, b]);
  }
  return out;
}
function parseOH(oh) {
  const week = Array.from({ length: 7 }, () => null); // null = no rule yet
  const rules = oh.replace(/\|\|/g, ";").split(";").flatMap((r) => r.split(/,\s*(?=(?:Mo|Tu|We|Th|Fr|Sa|Su|PH)\b)/));
  let any = false;
  for (let r of rules) {
    r = r.trim();
    if (!r) continue;
    if (/^PH\b/.test(r)) continue;
    if (/\b(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec|week|sunrise|sunset|dawn|dusk)\b/.test(r)) return null;
    const m = r.match(/^((?:(?:Mo|Tu|We|Th|Fr|Sa|Su|PH|SH)(?:\[[^\]]*\])?(?:-(?:Mo|Tu|We|Th|Fr|Sa|Su))?\s*,?\s*)+)\s*(.*)$/);
    let days, rest;
    if (m) { days = ohDays(m[1].replace(/\s+/g, "")); rest = m[2].trim(); } else { days = new Set([0, 1, 2, 3, 4, 5, 6]); rest = r; }
    if (!days) return null;
    rest = rest.replace(/"[^"]*"/g, "").trim();
    let ranges;
    if (/^(off|closed)$/i.test(rest)) ranges = [];
    else if (rest === "" || /^open$/i.test(rest) || rest === "24/7" || rest === "00:00-24:00") ranges = [[0, 1440]];
    else ranges = ohTimes(rest);
    if (!ranges) return null;
    for (const d of days) week[d] = ranges;
    any = true;
  }
  return any ? week.map((x) => x || []) : null;
}
function openAt(oh, date) {
  if (!oh) return null;
  const t = oh.trim();
  if (t === "24/7") return true;
  const week = parseOH(t);
  if (!week) return null;
  const dow = (date.getDay() + 6) % 7, min = date.getHours() * 60 + date.getMinutes();
  if (week[dow].some(([a, b]) => min >= a && min < b)) return true;
  const prev = week[(dow + 6) % 7];
  return prev.some(([, b]) => b > 1440 && min + 1440 < b);
}

/* ---------------- invite friends (share link) ---------------- */
function b64urlEncode(str) { return btoa(unescape(encodeURIComponent(str))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""); }
function b64urlDecode(str) { return decodeURIComponent(escape(atob(str.replace(/-/g, "+").replace(/_/g, "/")))); }
function groupLink() {
  const data = { v: 1, p: people.map((p) => [p.name, +p.lat.toFixed(4), +p.lon.toFixed(4), p.label]), m: settings.mode, g: settings.goal, t: settings.when || toLocalInput(meetDate()) };
  return location.origin + location.pathname + "#g=" + b64urlEncode(JSON.stringify(data));
}
let toastTimer = 0;
function toast(msg) {
  let el = document.querySelector(".toast");
  if (!el) { el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}
$("invite").addEventListener("click", async () => {
  const url = groupLink();
  const text = people.length
    ? `Where should we meet? Open this, add where you're coming from, then send the link back to the group.`
    : `Help pick where we meet: add where you're coming from.`;
  if (navigator.share) {
    try { await navigator.share({ title: "Meet in the Middle", text, url }); return; } catch (e) { if (e && e.name === "AbortError") return; }
  }
  try { await navigator.clipboard.writeText(url); toast("Link copied. Paste it in your group chat."); }
  catch (e) { prompt("Copy this link:", url); }
});
function loadFromHash() {
  const m = location.hash.match(/^#g=([A-Za-z0-9_-]+)/);
  if (!m) return false;
  try {
    const d = JSON.parse(b64urlDecode(m[1]));
    if (!d || !Array.isArray(d.p)) return false;
    people = d.p.slice(0, MAX_PEOPLE).map(([name, lat, lon, label], i) => ({ id: uid++, name: String(name || `Person ${i + 1}`).slice(0, 40), lat: +lat, lon: +lon, label: String(label || "Shared location").slice(0, 80), color: COLORS[i % COLORS.length] }))
      .filter((p) => isFinite(p.lat) && isFinite(p.lon));
    if (MODE_INFO[d.m]) settings.mode = d.m;
    if (GOALS[d.g]) settings.goal = d.g;
    if (typeof d.t === "string") settings.when = d.t;
    isExample = false;
    history.replaceState(null, "", location.pathname + location.search);
    const j = $("join");
    j.textContent = people.length >= MAX_PEOPLE
      ? `You opened a shared group of ${people.length}. Tap “Find the meeting spot” to see where to meet.`
      : `You joined a group of ${people.length}. Add yourself with “Use my location” or search your address, then tap “Invite friends” to send the updated link back.`;
    j.hidden = false;
    return true;
  } catch (e) { console.warn("Couldn't read the shared link", e); return false; }
}

/* ---------------- boot ---------------- */
const fromLink = (load(), loadFromHash());
if (!fromLink && !people.length) {
  people = EXAMPLE.map((p, i) => ({ ...p, id: uid++, color: COLORS[i] }));
  isExample = true;
}
flood.addTo(map);
bindSeg("mode", "mode"); bindSeg("goal", "goal"); goalHint(); modeHint(); syncWhen();
refresh();
fitToPeople();
